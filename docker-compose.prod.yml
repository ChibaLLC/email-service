services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  listmonk-db:
    extends:
      file: docker-compose.listmonk.yml
      service: listmonk-db

  listmonk-init:
    extends:
      file: docker-compose.listmonk.yml
      service: listmonk-init

  listmonk-app:
    extends:
      file: docker-compose.listmonk.yml
      service: listmonk-app

  app:
    extends:
      file: docker-compose.yml
      service: app

  stalwart-db:
    extends:
      file: docker-compose.stalwart.yml
      service: stalwart-db

  stalwart-redis:
    extends:
      file: docker-compose.stalwart.yml
      service: stalwart-redis

  stalwart-garage-config:
    extends:
      file: docker-compose.stalwart.yml
      service: stalwart-garage-config

  stalwart-garage:
    extends:
      file: docker-compose.stalwart.yml
      service: stalwart-garage

  stalwart-garage-init:
    extends:
      file: docker-compose.stalwart.yml
      service: stalwart-garage-init

  stalwart-config:
    extends:
      file: docker-compose.stalwart.yml
      service: stalwart-config

  stalwart:
    extends:
      file: docker-compose.stalwart.yml
      service: stalwart

  # ── Webmail clients ──────────────────────────────────────────────────────
  # Bulwark is the default webmail client (web-only, richer features).
  # See docker-compose.bulwark.yml for full configuration options.
  bulwark-web:
    extends:
      file: docker-compose.bulwark.yml
      service: bulwark-web

  postal-config:
    extends:
      file: docker-compose.postal.yml
      service: postal-config

  postal-init:
    extends:
      file: docker-compose.postal.yml
      service: postal-init

  postal-db:
    extends:
      file: docker-compose.postal.yml
      service: postal-db

  postal-web:
    extends:
      file: docker-compose.postal.yml
      service: postal-web

  postal-worker:
    extends:
      file: docker-compose.postal.yml
      service: postal-worker

  postal-smtp:
    extends:
      file: docker-compose.postal.yml
      service: postal-smtp

  libredesk-redis:
    extends:
      file: docker-compose.libredesk.yml
      service: libredesk-redis
  
  libredesk-db:
    extends:
        file: docker-compose.libredesk.yml
        service: libredesk-db
  
  libredesk-app:
    extends:
      file: docker-compose.libredesk.yml
      service: libredesk
    environment:
      - LIBREDESK_DB__HOST=${LIBREDESK_DB__HOST:-libredesk-db}
      - LIBREDESK_REDIS__ADDRESS=${LIBREDESK_REDIS__ADDRESS:-libredesk-redis:6379}
    depends_on:
      - libredesk-db
      - libredesk-redis

volumes:
  bulwark_data:
  stalwart_config:
  postgres_data:
  redis_data:
  listmonk_db_data:
  listmonk_config_data:
  listmonk_uploads_data:
  stalwart_data:
  stalwart_db_data:
  stalwart_redis_data:
  stalwart_garage_config:
  stalwart_garage_meta:
  stalwart_garage_data:
  stalwart_s3_credentials:
  postal_db_data:
  postal_config_data:
  libredesk-postgres-data:
  libredesk-redis-data:
  libredesk-uploads:
