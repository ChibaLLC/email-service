# Production-oriented Stalwart overlay.
# Includes dedicated PostgreSQL, Redis, and Garage services and preconfigures
# Stalwart to use them from first boot.

services:
  stalwart-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${STALWART_DB_USER:-stalwart}
      - POSTGRES_PASSWORD=${STALWART_DB_PASSWORD:-stalwart}
      - POSTGRES_DB=${STALWART_DB_NAME:-stalwart}
    expose:
      - "5432"
    volumes:
      - stalwart_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STALWART_DB_USER:-stalwart}"]
      interval: 10s
      timeout: 5s
      retries: 10

  stalwart-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${STALWART_REDIS_PASSWORD:-stalwart}
    expose:
      - "6379"
    volumes:
      - stalwart_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${STALWART_REDIS_PASSWORD:-stalwart} ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  stalwart-garage-config:
    image: python:3.12-alpine
    restart: "no"
    command: ["python", "/scripts/setup.py", "render"]
    environment:
      - STALWART_S3_REGION=${STALWART_S3_REGION:-garage}
    volumes:
      - ./scripts/garage:/scripts:ro
      - stalwart_garage_config:/etc/garage

  stalwart-garage:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.5.0}
    restart: unless-stopped
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    depends_on:
      stalwart-garage-config:
        condition: service_completed_successfully
    expose:
      - "3900"
    volumes:
      - stalwart_garage_config:/etc/garage:ro
      - stalwart_garage_meta:/var/lib/garage/meta
      - stalwart_garage_data:/var/lib/garage/data

  stalwart-garage-init:
    image: python:3.12-alpine
    restart: "no"
    command: ["python", "/scripts/setup.py", "initialize"]
    depends_on:
      stalwart-garage:
        condition: service_started
    environment:
      - STALWART_S3_BUCKET=${STALWART_S3_BUCKET:-stalwart}
      - GARAGE_CAPACITY_BYTES=${GARAGE_CAPACITY_BYTES:-}
      - STALWART_UID=${STALWART_UID:-2000}
    volumes:
      - ./scripts/garage:/scripts:ro
      - stalwart_garage_config:/etc/garage:ro
      - stalwart_garage_data:/var/lib/garage/data:ro
      - stalwart_s3_credentials:/etc/stalwart-s3

  stalwart-config:
    depends_on:
      stalwart-garage-init:
        condition: service_completed_successfully
    image: node:20-alpine
    restart: "no"
    environment:
      - STALWART_CONFIG_DIR=/etc/stalwart
      - STALWART_UID=${STALWART_UID:-2000}
      - STALWART_HOSTNAME=${STALWART_HOSTNAME:-mail.example.com}
      - STALWART_DEFAULT_DOMAIN=${STALWART_DEFAULT_DOMAIN:-}
      - STALWART_HTTP_CORS_ALLOWED_ORIGINS=${STALWART_HTTP_CORS_ALLOWED_ORIGINS:-https://${BULWARK_WEBMAIL_HOSTNAME:-webmail.example.com}}
      - STALWART_HTTP_PERMISSIVE_CORS=${STALWART_HTTP_PERMISSIVE_CORS:-false}
      - STALWART_ALLOWED_IP=${STALWART_ALLOWED_IP:-}
      - STALWART_ADMIN_USER=${STALWART_ADMIN_USER:-admin}
      - STALWART_ADMIN_PASSWORD=${STALWART_ADMIN_PASSWORD:-change-me-stalwart-admin}
      - STALWART_ACME_ENABLED=${STALWART_ACME_ENABLED:-false}
      - STALWART_HTTP_USE_X_FORWARDED=${STALWART_HTTP_USE_X_FORWARDED:-false}
      - STALWART_DB_USER=${STALWART_DB_USER:-stalwart}
      - STALWART_DB_PASSWORD=${STALWART_DB_PASSWORD:-stalwart}
      - STALWART_DB_NAME=${STALWART_DB_NAME:-stalwart}
      - STALWART_REDIS_PASSWORD=${STALWART_REDIS_PASSWORD:-stalwart}
      - STALWART_S3_BUCKET=${STALWART_S3_BUCKET:-stalwart}
      - STALWART_S3_REGION=${STALWART_S3_REGION:-garage}
      - STALWART_S3_ENDPOINT=http://stalwart-garage:3900
      - STALWART_S3_ACCESS_KEY_FILE=/etc/stalwart-s3/access-key
      - STALWART_S3_SECRET_KEY_FILE=/etc/stalwart-s3/secret-key
    command: ["node", "/scripts/init.mjs"]
    volumes:
      - ./scripts/stalwart:/scripts:ro
      - stalwart_config:/etc/stalwart
      - stalwart_s3_credentials:/etc/stalwart-s3:ro

  stalwart:
    hostname: ${STALWART_HOSTNAME:?STALWART_HOSTNAME is required}
    image: ${STALWART_IMAGE:-stalwartlabs/stalwart:latest}
    command: ["--config", "/etc/stalwart/config.json"]
    restart: unless-stopped
    environment:
      - STALWART_PUBLIC_URL=${STALWART_PUBLIC_URL:-https://mail.example.com}
      - STALWART_RECOVERY_ADMIN=${STALWART_ADMIN_USER:-admin}:${STALWART_ADMIN_PASSWORD:-change-me-stalwart-admin}
      - STALWART_DB_PASSWORD=${STALWART_DB_PASSWORD:-stalwart}
    depends_on:
      stalwart-db:
        condition: service_healthy
      stalwart-redis:
        condition: service_healthy
      stalwart-garage-init:
        condition: service_completed_successfully
      stalwart-config:
        condition: service_completed_successfully
    labels:
      - traefik.enable=${STALWART_TRAEFIK_ENABLED:-false}
      - traefik.docker.network=${STALWART_TRAEFIK_DOCKER_NETWORK:-${COMPOSE_PROJECT_NAME:-email-service}_default}
      - "traefik.http.routers.mailserver.rule=Host(`${STALWART_HOSTNAME:?STALWART_HOSTNAME is required}`) || Host(`${STALWART_AUTODISCOVER_HOSTNAME:?STALWART_AUTODISCOVER_HOSTNAME is required}`) || Host(`${STALWART_AUTOCONFIG_HOSTNAME:?STALWART_AUTOCONFIG_HOSTNAME is required}`) || Host(`${STALWART_MTA_STS_HOSTNAME:?STALWART_MTA_STS_HOSTNAME is required}`)"
      - traefik.http.routers.mailserver.entrypoints=${STALWART_TRAEFIK_HTTPS_ENTRYPOINT:-https}
      - traefik.http.routers.mailserver.service=mailserver
      - traefik.http.services.mailserver.loadbalancer.server.port=8080
      - "traefik.tcp.routers.smtp.rule=HostSNI(`*`)"
      - traefik.tcp.routers.smtp.entrypoints=${STALWART_TRAEFIK_SMTP_ENTRYPOINT:-smtp}
      - traefik.tcp.routers.smtp.service=smtp
      - traefik.tcp.services.smtp.loadbalancer.server.port=25
      - traefik.tcp.services.smtp.loadbalancer.proxyProtocol.version=2
      - "traefik.tcp.routers.jmap.rule=HostSNI(`*`)"
      - traefik.tcp.routers.jmap.tls.passthrough=true
      - traefik.tcp.routers.jmap.entrypoints=${STALWART_TRAEFIK_HTTPS_ENTRYPOINT:-https}
      - traefik.tcp.routers.jmap.service=jmap
      - traefik.tcp.services.jmap.loadbalancer.server.port=443
      - traefik.tcp.services.jmap.loadbalancer.proxyProtocol.version=2
      - "traefik.tcp.routers.smtps.rule=HostSNI(`*`)"
      - traefik.tcp.routers.smtps.tls.passthrough=true
      - traefik.tcp.routers.smtps.entrypoints=${STALWART_TRAEFIK_SMTPS_ENTRYPOINT:-smtps}
      - traefik.tcp.routers.smtps.service=smtps
      - traefik.tcp.services.smtps.loadbalancer.server.port=465
      - traefik.tcp.services.smtps.loadbalancer.proxyProtocol.version=2
      - "traefik.tcp.routers.imaps.rule=HostSNI(`*`)"
      - traefik.tcp.routers.imaps.tls.passthrough=true
      - traefik.tcp.routers.imaps.entrypoints=${STALWART_TRAEFIK_IMAPS_ENTRYPOINT:-imaps}
      - traefik.tcp.routers.imaps.service=imaps
      - traefik.tcp.services.imaps.loadbalancer.server.port=993
      - traefik.tcp.services.imaps.loadbalancer.proxyProtocol.version=2
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
    volumes:
      - stalwart_config:/etc/stalwart
      - stalwart_s3_credentials:/etc/stalwart-s3:ro
      - stalwart_data:/var/lib/stalwart

  bulwark-web:
    extends:
      file: docker-compose.bulwark.yml
      service: bulwark-web

volumes:
  bulwark_data:
  stalwart_config:
  stalwart_data:
  stalwart_db_data:
  stalwart_redis_data:
  stalwart_garage_config:
  stalwart_garage_meta:
  stalwart_garage_data:
  stalwart_s3_credentials:
